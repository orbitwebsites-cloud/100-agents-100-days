# fly launch --no-deploy && fly volumes create hundred_data --size 1 && fly secrets set STRIPE_SECRET_KEY=... && fly deploy
app = "hundred-agents"
primary_region = "iad"

[build]

[env]
  PUBLIC_URL = "https://hundred-agents.fly.dev"
  DATABASE_PATH = "/data/hundred.db"

[mounts]
  source = "hundred_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # keep one machine up: SQLite + webhooks
  min_machines_running = 1

[[http_service.checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
