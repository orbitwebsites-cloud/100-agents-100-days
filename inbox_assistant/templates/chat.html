<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Inbox Assistant</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f4f7; color: #1a1a1a; height: 100vh; display: flex; flex-direction: column;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16161a; color: #e8e8ec; }
    .bubble.bot { background: #26262e !important; color: #e8e8ec !important; }
    .composer { background: #1e1e24 !important; border-top-color: #33333c !important; }
    input[type=text] { background: #26262e !important; color: #e8e8ec !important; border-color: #3a3a44 !important; }
    #clear-btn { border-color: #3a3a44 !important; color: #e8e8ec !important; }
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid rgba(0,0,0,.08);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: #34c759; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .sub { font-size: 12px; opacity: .6; margin-left: auto; }
  #clear-btn {
    font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 8px;
    border: 1px solid rgba(0,0,0,.15); background: transparent; color: inherit;
    opacity: .7; cursor: pointer;
  }
  #clear-btn:hover { opacity: 1; }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { display: flex; flex-direction: column; max-width: 72%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.45;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: #fff; border: 1px solid rgba(0,0,0,.08); border-bottom-left-radius: 4px; }
  .bubble.pending { opacity: .75; }
  .meta { font-size: 11px; opacity: .5; margin-top: 3px; padding: 0 4px; }
  .thinking { display: inline-flex; align-items: center; gap: 4px; height: 12px; }
  .thinking span {
    width: 6px; height: 6px; border-radius: 50%; background: currentColor;
    opacity: .25; animation: think-blink 1.4s infinite ease-in-out both;
  }
  .thinking span:nth-child(2) { animation-delay: .2s; }
  .thinking span:nth-child(3) { animation-delay: .4s; }
  @keyframes think-blink {
    0%, 80%, 100% { opacity: .25; transform: scale(.85); }
    40% { opacity: 1; transform: scale(1); }
  }
  .composer {
    display: flex; gap: 8px; padding: 12px; border-top: 1px solid rgba(0,0,0,.08);
    background: #fff; flex-shrink: 0;
  }
  input[type=text] {
    flex: 1; padding: 11px 14px; border-radius: 12px; border: 1px solid rgba(0,0,0,.15);
    font-size: 14px; outline: none;
  }
  input[type=text]:disabled { opacity: .6; }
  button {
    padding: 0 18px; border-radius: 12px; border: none; background: #2563eb; color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1>Inbox Assistant</h1>
    <span class="sub" id="status">{{ brain }} · {{ mode }}</span>
    <button type="button" id="clear-btn">Clear chat</button>
  </header>
  <div id="log"></div>
  <form class="composer" id="form">
    <input type="text" id="input" aria-label="Ask a question about your email" placeholder="Ask about an order, a bill, a delivery…" autocomplete="off" autofocus>
    <button type="submit">Send</button>
  </form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const clearBtn = document.getElementById('clear-btn');
const sendBtn = form.querySelector('button');

const csrfMeta = document.querySelector('meta[name="csrf-token"]');
const CSRF_TOKEN = csrfMeta ? csrfMeta.content : '';

const HISTORY_LIMIT = 20;
let history = [];

const GREETING = "Ask me things like \"what did I order from Amazon?\" or \"when does my passport expire?\"";

function timeLabel() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function addBubble(text, who, pending) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + who;

  const el = document.createElement('div');
  el.className = 'bubble ' + who + (pending ? ' pending' : '');

  if (pending) {
    const dots = document.createElement('span');
    dots.className = 'thinking';
    for (let i = 0; i < 3; i++) {
      dots.appendChild(document.createElement('span'));
    }
    el.appendChild(dots);
  } else {
    el.textContent = text;
  }

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = timeLabel();

  wrap.appendChild(el);
  wrap.appendChild(meta);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return el;
}

function resetChat() {
  log.textContent = '';
  history = [];
  addBubble(GREETING, 'bot');
}

resetChat();

clearBtn.addEventListener('click', () => {
  resetChat();
  input.focus();
});

async function sendQuestion(q) {
  addBubble(q, 'user');
  const pending = addBubble('', 'bot', true);

  sendBtn.disabled = true;
  input.disabled = true;

  const payload = { question: q, history: history.slice(-HISTORY_LIMIT) };

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
      body: JSON.stringify(payload)
    });

    let data = null;
    try {
      data = await res.json();
    } catch (parseErr) {
      console.error('Response was not JSON:', parseErr);
      data = null;
    }

    let answer;
    if (data && typeof data.answer === 'string' && data.answer) {
      answer = data.answer;
    } else if (res.ok) {
      answer = '(no answer)';
    } else {
      answer = 'Something went wrong on the server. Please try again in a moment.';
    }

    pending.textContent = answer;
    pending.classList.remove('pending');
    history.push({ role: 'user', content: q }, { role: 'assistant', content: answer });
  } catch (err) {
    console.error('Request to /api/ask failed:', err);
    pending.textContent = "Couldn't reach the assistant. Check your connection and try again.";
    pending.classList.remove('pending');
  } finally {
    sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  // Fire-and-forget: sendQuestion handles all errors internally
  // (try/catch/finally); the .catch is a belt-and-braces guard so the
  // promise can never float or reject unhandled.
  sendQuestion(q).catch((err) => console.error('sendQuestion failed unexpectedly:', err));
});
</script>
</body>
</html>
